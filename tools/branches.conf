# What of the data lives on a branch of its own, beside `data`: jsDelivr
# serves no branch over 50 MB (it answers 403 for every file of one, as soon
# as the file is not in its cache), so `data` keeps what the consoles' apps
# read (PlayShelf: platforms/switch/) and the lighter platforms, and the
# heaviest folders go beside it. tools/publish.sh sends each path to its
# branch, tools/side-branches.sh puts them back in a run's folder, so the
# tools read one folder as before.
#
# <branch> <path>…   (a branch whose name starts with `data` is served by
# jsDelivr: https://cdn.jsdelivr.net/gh/JigSawFr/Atlas@<branch>/<file>)
sources sources
data-stores platforms/steam platforms/gog links.json
