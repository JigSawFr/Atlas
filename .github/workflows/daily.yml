# What changes every day: the popular games' trends on the Wikipedias of
# PlayShelf's languages (tools/trends.py, switch/popular.json's `trend`) and
# each game's price and sale in a few countries' eShops (tools/prices.py,
# switch/prices/), committed to the `data` branch, where PlayShelf reads
# them through jsDelivr.
name: daily

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  actions: write  # keeping the schedules on

# One writer of the data branch at a time: the weekly build waits for it.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALERTS: /tmp/playinsights-alerts.md   # runner.temp is not allowed at the job level
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin data:refs/remotes/origin/data
          git worktree add data-branch origin/data
          git -C data-branch checkout -B data
          # The Switch's files at the root, as before switch/: moved there.
          python3 tools/migrate.py data-branch
      # A failure of one leaves the other's files to publish.
      - name: Trends
        id: trends
        continue-on-error: true
        run: python3 tools/trends.py out data-branch
      - name: Prices
        id: prices
        continue-on-error: true
        run: python3 tools/prices.py out data-branch
      - name: Publish to the data branch
        run: |
          mkdir -p data-branch/switch/prices
          if [ -f out/switch/popular.json ]; then cp out/switch/popular.json data-branch/switch/; fi
          if ls out/switch/prices/*.json >/dev/null 2>&1; then cp out/switch/prices/*.json data-branch/switch/prices/; fi
          tools/publish.sh data-branch "daily: $(date -u +%Y-%m-%d)"
      # GitHub turns off a public repository's schedules after 60 days with
      # no activity, and the data branch's pushes may not count: enabling
      # them again, every day, starts those 60 days over.
      - name: Keep the schedules on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily.yml
          gh workflow enable build.yml
      # Anything wrong (the job, a step that may fail, a file the guard
      # kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "trends=${{ steps.trends.outcome }} prices=${{ steps.prices.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
