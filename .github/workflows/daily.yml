# What changes every day, a job a platform side by side, then one job that
# commits it all to the `data` branch, where PlayShelf reads it through
# jsDelivr:
# - switch: the popular games' trends on the Wikipedias of PlayShelf's
#   languages (tools/trends.py, switch/popular.json's `trend`) and each
#   game's price and sale in a few countries' eShops (tools/prices.py,
#   switch/prices/);
# - steam: each game's price and sale in the same countries' Steam stores
#   (tools/steam_prices.py, steam/prices/);
# - gog: the same in GOG's (tools/gog.py prices, gog/prices/).
# A platform whose job fails keeps its last run's files.
name: daily

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  actions: write  # keeping the schedules on

# One writer of the data branch at a time: the weekly build waits for it.
concurrency:
  group: build
  cancel-in-progress: false

env:
  ALERTS: /tmp/playinsights-alerts.md   # runner.temp is not allowed at this level

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      trends: ${{ steps.trends.outcome }}
      prices: ${{ steps.prices.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: tools/data-branch.sh
      # A failure of one leaves the other's files to publish.
      - name: Trends
        id: trends
        continue-on-error: true
        run: python3 tools/trends.py out data-branch
      - name: Prices
        id: prices
        continue-on-error: true
        run: python3 tools/prices.py out data-branch
      - name: Keep the files
        run: |
          mkdir -p out
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch
          path: out/
          include-hidden-files: true
          retention-days: 3

  steam:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: tools/data-branch.sh
      - name: Prices
        run: python3 tools/steam_prices.py out data-branch
      - name: Keep the files
        run: |
          mkdir -p out
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam
          path: out/
          include-hidden-files: true
          retention-days: 3

  gog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: tools/data-branch.sh
      - name: Prices
        run: python3 tools/gog.py prices out data-branch
      - name: Keep the files
        run: |
          mkdir -p out
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gog
          path: out/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [switch, steam, gog]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The data branch
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: made
      - name: Publish to the data branch
        run: |
          for dir in made/*/; do
            if [ -f "$dir.alerts" ]; then cat "$dir.alerts" >> "$ALERTS"; rm "$dir.alerts"; fi
            cp -r "$dir". data-branch/
          done
          tools/publish.sh data-branch "daily: $(date -u +%Y-%m-%d)"
      # GitHub turns off a public repository's schedules after 60 days with
      # no activity, and the data branch's pushes may not count: enabling
      # them again, every day, starts those 60 days over.
      - name: Keep the schedules on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily.yml
          gh workflow enable build.yml
      # Anything wrong (a platform's job, a step that may fail, a file the
      # guard kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "switch=${{ needs.switch.result }} trends=${{ needs.switch.outputs.trends }} prices=${{ needs.switch.outputs.prices }} steam=${{ needs.steam.result }} gog=${{ needs.gog.result }}"
        run: tools/alert.sh "${{ github.workflow }}"
