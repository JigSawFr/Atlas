# What changes every day: each game's price and sale in a few countries'
# eShops (tools/prices.py, the data branch's prices/ folder), committed to
# the `data` branch, where PlayShelf reads them through jsDelivr.
name: daily

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One writer of the data branch at a time: the weekly build waits for it.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin data:refs/remotes/origin/data
          git worktree add data-branch origin/data
          git -C data-branch checkout -B data
      - name: Prices
        run: python3 tools/prices.py out data-branch
      - name: Commit to the data branch
        run: |
          mkdir -p data-branch/prices
          cp out/prices/*.json data-branch/prices/
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "prices: $(date -u +%Y-%m-%d)"
          git push origin data
          for f in prices/*.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" >/dev/null || true
          done
