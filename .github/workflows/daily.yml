# What changes every day, in two steps:
# - the sources asked (tools/collect.py: sources/<source>/): the best known
#   Switch and Steam games' pages on the Wikipedias of PlayShelf's languages
#   (Wikidata), then their views a day (Wikimedia);
# - platforms/switch/ and steam/popular.json's trends made from them, asking
#   nothing (tools/trends.py); then everything committed to the `data`
#   branch, where PlayShelf reads it through jsDelivr. A file made from
#   nothing collected today is left as it was.
name: daily

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  actions: write  # keeping the schedules on

# One writer of the data branch at a time: the weekly build waits for it.
concurrency:
  group: build
  cancel-in-progress: false

env:
  ALERTS: /tmp/atlas-alerts.md   # runner.temp is not allowed at this level

jobs:
  sources:
    runs-on: ubuntu-26.04
    # The Switch's and Steam's best known games' pages, some 20 minutes, and up to 10 waiting for Wikimedia
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # library/boreale-site: the site's build, which the tests run
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: tools/data-branch.sh
      - name: Wikidata
        run: python3 tools/collect.py wikidata daily out data-branch
      # The views of the pages Wikidata just gave.
      - name: Wikipedia
        run: python3 tools/collect.py wikipedia daily out data-branch out
      - name: Keep the files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          touch "$ALERTS"
          # A job that failed or ran out of time says so.
          [ "$JOB_STATUS" = success ] || echo "**sources** ended in **$JOB_STATUS**; their files are the last run's." >> "$ALERTS"
          cp "$ALERTS" out/.alerts-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sources
          path: out/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: sources
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The data branch
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: fresh
      - name: Trends
        id: trends
        continue-on-error: true
        run: python3 tools/trends.py out data-branch fresh
      - name: Publish to the data branch
        run: |
          for f in fresh/.alerts-*; do [ -f "$f" ] && cat "$f" >> "$ALERTS" && rm "$f"; done
          if [ -d fresh/sources ]; then cp -r fresh/sources data-branch/; fi
          if [ -d out ]; then rsync -a --exclude .runtimes out/ data-branch/; fi
          # One time: the prices' files gone from the branch (tools/drop-prices.sh says when it goes).
          tools/drop-prices.sh data-branch
          # What changed since the last run (changes.json, light files),
          # how the data is (report.json), then every file checked against its
          # schema (a wrong one put back as it was), schemas/ written again.
          python3 tools/changes.py data-branch
          python3 tools/report.py data-branch daily fresh out
          python3 tools/schemas.py publish data-branch
          tools/publish.sh data-branch "daily: $(date -u +%Y-%m-%d)"
      # GitHub turns off a public repository's schedules after 60 days with
      # no activity, and the data branch's pushes may not count: enabling
      # them again, every day, starts those 60 days over.
      - name: Keep the schedules on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily.yml
          gh workflow enable build.yml
      # Anything wrong (a source's job, a platform's step, a file the guard
      # kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "sources=${{ needs.sources.result }} trends=${{ steps.trends.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
