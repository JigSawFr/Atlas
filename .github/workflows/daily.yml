# What changes every day: the popular games' trends on the Wikipedias of
# PlayShelf's languages (tools/trends.py, popular.json's `trend`) and each
# game's price and sale in a few countries' eShops (tools/prices.py, the
# prices/ folder), committed to the `data` branch, where PlayShelf reads
# them through jsDelivr.
name: daily

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong

# One writer of the data branch at a time: the weekly build waits for it.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALERTS: ${{ runner.temp }}/alerts.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin data:refs/remotes/origin/data
          git worktree add data-branch origin/data
          git -C data-branch checkout -B data
      # A failure of one leaves the other's files to publish.
      - name: Trends
        id: trends
        continue-on-error: true
        run: python3 tools/trends.py out data-branch
      - name: Prices
        id: prices
        continue-on-error: true
        run: python3 tools/prices.py out data-branch
      - name: Commit to the data branch
        run: |
          mkdir -p data-branch/prices
          if [ -f out/popular.json ]; then cp out/popular.json data-branch/; fi
          if ls out/prices/*.json >/dev/null 2>&1; then cp out/prices/*.json data-branch/prices/; fi
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "daily: $(date -u +%Y-%m-%d)"
          git push origin data
          for f in popular.json prices/*.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" >/dev/null || true
          done
      # Anything wrong (the job, a step that may fail, a file the guard
      # kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "trends=${{ steps.trends.outcome }} prices=${{ steps.prices.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
