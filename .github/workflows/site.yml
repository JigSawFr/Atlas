# Atlas's website (site/README.md) on GitHub Pages, its source GitHub
# Actions (Settings › Pages): the pages, plus a copy of the data branch under
# data/ and cut for the explorer under x/, so the explorer reads its data from
# the site itself. Made again after each successful build or daily run (the
# data changed), at each push to main touching the site, and on demand; a
# pull request only builds and checks it.
#
# The checkout, the layout check and the Pages artifact are boreale-site's
# reusable workflow (library/boreale-site's README, "Reusable workflow");
# the deployment is this repository's.
name: site

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "tools/build_site.py", "tools/site_data.py", "tools/common.py", "tools/check_site.py", "library/boreale-site", ".github/workflows/site.yml" ]
  pull_request:
    paths: [ "site/**", "tools/build_site.py", "tools/site_data.py", "tools/common.py", "tools/check_site.py", "library/boreale-site", ".github/workflows/site.yml" ]
  workflow_run:
    workflows: [ build, daily ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # After a build or daily run, only one that succeeded on main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      pages: read   # asked by the reusable workflow (the site's address)
    uses: JigSawFr/boreale-site/.github/workflows/site.yml@49844b1a733f738afdabcc1c903bbf8696028d96 # v1.0.0
    with:
      ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      setup: git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/data"
      build: python3 tools/build_site.py build "$RUNNER_TEMP/data"
      check: |
        # Their links, catalogs and Content-Security-Policy, then the size.
        python3 tools/check_site.py build
        du -sh build build/data build/x | tee -a "$GITHUB_STEP_SUMMARY"
      # The explorer is also opened on a list, the trending and a game's
      # sheet, in English and another language, once its data is built (x/).
      skip: '["data", "x"]'
      wait: networkidle
      extra_if: x
      extra: '["explore/#steam/popular", "explore/#switch/trending", "fr/explore/#switch/game/0100000000010000", "explore/#steam/search/portal", "explore/#steam/game/620"]'
      pages_artifact: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
