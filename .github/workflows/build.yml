# The data files made again every Monday (and on demand), in two steps:
# - each source asked once, side by side where nothing else is needed first
#   (tools/collect.py: sources/<source>/, its own guard);
# - the platforms' files made from them, asking nothing (links, switch,
#   steam, gog, xbox, 3ds, the old machines), then everything committed to the `data`
#   branch, where PlayShelf reads it through jsDelivr, and kept as a release
#   (tools/archive.sh). A source that fails leaves its last run's files, and
#   the platforms are made from those; a platform that fails keeps its own.
name: build

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  id-token: write   # the archive's build provenance
  attestations: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  ALERTS: /tmp/atlas-alerts.md   # runner.temp is not allowed at this level

jobs:
  # The sources nothing else is needed for.
  first:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [wikidata, titledb, nlib-ctr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: tools/data-branch.sh
      - name: Collect
        run: python3 tools/collect.py "${{ matrix.source }}" weekly out data-branch
      - name: Keep the files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          touch "$ALERTS"
          # A job that failed or ran out of time says which source it was.
          [ "$JOB_STATUS" = success ] || echo "**sources (${{ matrix.source }})** ended in **$JOB_STATUS**; its files are the last run's." >> "$ALERTS"
          cp "$ALERTS" "out/.alerts-${{ matrix.source }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-${{ matrix.source }}
          path: out/
          include-hidden-files: true
          retention-days: 3

  # The sources asked about the games Wikidata gives them.
  stores:
    needs: first
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [steam-store, steamspy, gog, msstore, igdb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The last run's files
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-wikidata
          path: fresh
      - name: Collect
        # IGDB's keys, when the repository has them (tools/igdb.py): without
        # them nothing is asked of it.
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python3 tools/collect.py "${{ matrix.source }}" weekly out data-branch fresh
      - name: Keep the files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          touch "$ALERTS"
          # A job that failed or ran out of time says which source it was.
          [ "$JOB_STATUS" = success ] || echo "**sources (${{ matrix.source }})** ended in **$JOB_STATUS**; its files are the last run's." >> "$ALERTS"
          cp "$ALERTS" "out/.alerts-${{ matrix.source }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-${{ matrix.source }}
          path: out/
          include-hidden-files: true
          retention-days: 3

  # The best known games' English pages' views: which ones, the stores say.
  wikipedia:
    needs: [first, stores]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The last run's files
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-*
          merge-multiple: true
          path: fresh
      - name: Collect
        run: python3 tools/collect.py wikipedia weekly out data-branch fresh
      - name: Keep the files
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          touch "$ALERTS"
          # A job that failed or ran out of time says which source it was.
          [ "$JOB_STATUS" = success ] || echo "**wikipedia** ended in **$JOB_STATUS**; its files are the last run's." >> "$ALERTS"
          cp "$ALERTS" out/.alerts-wikipedia
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-wikipedia
          path: out/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [first, stores, wikipedia]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The last run's files
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-*
          merge-multiple: true
          path: fresh
      # Each platform's files from the sources (this run's, else the last
      # run's); one that fails keeps its last run's files.
      - name: Links
        id: links
        continue-on-error: true
        run: python3 tools/links.py out data-branch fresh
      - name: Switch
        id: switch
        continue-on-error: true
        run: python3 tools/build.py out data-branch fresh
      - name: Steam
        id: steam
        continue-on-error: true
        run: python3 tools/steam.py out data-branch fresh
      - name: GOG
        id: gog
        continue-on-error: true
        run: python3 tools/gog.py catalog out data-branch fresh
      - name: Xbox
        id: xbox
        continue-on-error: true
        run: python3 tools/xbox.py catalog out data-branch fresh
      - name: Retro
        id: retro
        continue-on-error: true
        run: python3 tools/retro.py out data-branch fresh
      - name: 3DS
        id: n3ds
        continue-on-error: true
        run: python3 tools/n3ds.py out data-branch fresh
      - name: Publish to the data branch
        run: |
          for f in fresh/.alerts-*; do [ -f "$f" ] && cat "$f" >> "$ALERTS" && rm "$f"; done
          if [ -d fresh/sources ]; then cp -r fresh/sources data-branch/; fi
          if [ -d out ]; then rsync -a --exclude .runtimes out/ data-branch/; fi
          # What changed since the last run (changes.json, history/, light files),
          # how the data is (report.json), then every file checked against its
          # schema (a wrong one put back as it was), schemas/ written again.
          python3 tools/changes.py data-branch
          python3 tools/report.py data-branch build fresh out
          python3 tools/schemas.py publish data-branch
          tools/publish.sh data-branch "data: $(date -u +%Y-%m-%d)"
      # The week's files kept as a release, each and their zip attested
      # (`gh attestation verify switch-popular.json -R JigSawFr/Atlas`).
      - name: Archive
        id: archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/archive.sh data-branch "$(date -u +%Y-%m-%d)" archive
      - name: Attest the files
        id: attest
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            archive/*.json
            archive/*.zip
      # Anything wrong (a source's job, a platform's step, a step that may
      # fail, a file the guard kept): an issue labelled data-alert, or a
      # comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "sources=${{ needs.first.result }} stores=${{ needs.stores.result }} wikipedia=${{ needs.wikipedia.result }} links=${{ steps.links.outcome }} switch=${{ steps.switch.outcome }} steam=${{ steps.steam.outcome }} gog=${{ steps.gog.outcome }} xbox=${{ steps.xbox.outcome }} retro=${{ steps.retro.outcome }} 3ds=${{ steps.n3ds.outcome }} archive=${{ steps.archive.outcome }} attestation=${{ steps.attest.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
