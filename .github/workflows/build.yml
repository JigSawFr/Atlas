# The data files made again every Monday (and on demand), then committed to
# the `data` branch, where PlayShelf reads them through jsDelivr, and kept
# as a release (tools/archive.sh).
name: build

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  id-token: write   # the archive's build provenance
  attestations: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALERTS: /tmp/playinsights-alerts.md   # runner.temp is not allowed at the job level
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data-branch origin/data
            git -C data-branch checkout -B data
          else
            git worktree add --orphan -b data data-branch
          fi
          # The Switch's files at the root, as before switch/: moved there.
          python3 tools/migrate.py data-branch
      - name: Build
        # IGDB's keys, when the repository has them (tools/igdb.py): without
        # them the files are made from the other sources alone.
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python3 tools/build.py out data-branch
      - name: Publish to the data branch
        run: |
          cp -r out/. data-branch/
          tools/publish.sh data-branch "data: $(date -u +%Y-%m-%d)"
      # The week's files kept as a release, each and their zip attested
      # (`gh attestation verify popular.json -R JigSawFr/PlayInsights`).
      - name: Archive
        id: archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/archive.sh data-branch "$(date -u +%Y-%m-%d)" archive
      - name: Attest the files
        id: attest
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            archive/*.json
            archive/*.zip
      # Anything wrong (the job, a step that may fail, a file the guard
      # kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "archive=${{ steps.archive.outcome }} attestation=${{ steps.attest.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
