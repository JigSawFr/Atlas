# The data files made again every Monday (and on demand), then committed to
# the `data` branch, where PlayShelf reads them through jsDelivr.
name: build

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALERTS: ${{ runner.temp }}/alerts.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data-branch origin/data
            git -C data-branch checkout -B data
          else
            git worktree add --orphan -b data data-branch
          fi
      - name: Build
        # IGDB's keys, when the repository has them (tools/igdb.py): without
        # them the files are made from the other sources alone.
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python3 tools/build.py out data-branch
      - name: Commit to the data branch
        run: |
          cp out/*.json data-branch/
          cd data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "data: $(date -u +%Y-%m-%d)"
          git push origin data
          # jsDelivr keeps a branch's files up to 12 hours: asked again now.
          for f in *.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" >/dev/null || true
          done
      # Anything wrong (the job, a step that may fail, a file the guard
      # kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: ""
        run: tools/alert.sh "${{ github.workflow }}"
