# The data files made again every Monday (and on demand): a job a platform,
# side by side, then one job that commits them all to the `data` branch,
# where PlayShelf reads them through jsDelivr, and keeps them as a release
# (tools/archive.sh). A platform whose job fails keeps its last run's files.
name: build

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # tools/alert.sh: an issue when a run goes wrong
  id-token: write   # the archive's build provenance
  attestations: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  ALERTS: /tmp/playinsights-alerts.md   # runner.temp is not allowed at this level

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      links: ${{ steps.links.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: tools/data-branch.sh
      - name: Build
        # IGDB's keys, when the repository has them (tools/igdb.py): without
        # them the files are made from the other sources alone.
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python3 tools/build.py out data-branch
      # Each game's ids on every platform (links.json): one Wikidata query.
      - name: Links
        id: links
        continue-on-error: true
        run: python3 tools/links.py out data-branch
      - name: Keep the files
        run: |
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: switch
          path: out/
          include-hidden-files: true
          retention-days: 3

  steam:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        env:
          ALERTS: ""   # the run's alerts are not the tests' (tests/test_common.py)
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: tools/data-branch.sh
      - name: Build
        run: python3 tools/steam.py out data-branch
      - name: Keep the files
        run: |
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam
          path: out/
          include-hidden-files: true
          retention-days: 3

  gog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: The last run's files
        run: tools/data-branch.sh
      - name: Build
        run: python3 tools/gog.py catalog out data-branch
      - name: Keep the files
        run: |
          touch "$ALERTS"
          cp "$ALERTS" out/.alerts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gog
          path: out/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [switch, steam, gog]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The last run's files
        run: tools/data-branch.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: made
      # Each platform's files that were made; the others keep the last run's.
      - name: Publish to the data branch
        run: |
          for dir in made/*/; do
            if [ -f "$dir.alerts" ]; then cat "$dir.alerts" >> "$ALERTS"; rm "$dir.alerts"; fi
            cp -r "$dir". data-branch/
          done
          tools/publish.sh data-branch "data: $(date -u +%Y-%m-%d)"
      # The week's files kept as a release, each and their zip attested
      # (`gh attestation verify switch-popular.json -R JigSawFr/PlayInsights`).
      - name: Archive
        id: archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/archive.sh data-branch "$(date -u +%Y-%m-%d)" archive
      - name: Attest the files
        id: attest
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            archive/*.json
            archive/*.zip
      # Anything wrong (a platform's job, a step that may fail, a file the
      # guard kept): an issue labelled data-alert, or a comment on the open one.
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "switch=${{ needs.switch.result }} steam=${{ needs.steam.result }} gog=${{ needs.gog.result }} links=${{ needs.switch.outputs.links }} archive=${{ steps.archive.outcome }} attestation=${{ steps.attest.outcome }}"
        run: tools/alert.sh "${{ github.workflow }}"
