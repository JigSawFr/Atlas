# The workflow actions are pinned to commit SHAs (a moved tag cannot swap the
# code that runs with write access to the data branch), but a pinned action
# never updates on its own, security fixes included. Dependabot moves the SHA
# and its version comment together, in one pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: [ "*" ]
  # library/boreale-site: what Boréale's sites share, followed on its main.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
